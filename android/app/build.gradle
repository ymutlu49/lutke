plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    // NOT (Mayıs 2026): com.google.gms.google-services plugin'i kaldırıldı.
    // Firebase kullanmıyoruz; Cloudflare Pages Functions + D1 ile auth.
    // Plugin google-services.json gerektiriyordu, dosya yoktu → build fail.
    // Firebase paketleri pubspec'te kalsın diye dependency'ler korunuyor
    // (lib/ içinde stub olarak duruyor, runtime'da try-catch ile yakalanır).
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0.0"
}

// ── Release Signing Yapılandırması ─────────────────────────────
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.lutke.kurmanci"
    compileSdk 36
    // Kurulu NDK'ye sabitlendi (flutter.ndkVersion farklı sürüm isteyip
    // "failed to strip debug symbols" hatasına yol açıyordu).
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "com.lutke.kurmanci"
        minSdkVersion flutter.minSdkVersion
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
                storeFile keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
                storePassword keystoreProperties["storePassword"]
            }
        }
    }

    // AGP 8.2 + NDK 28 uyumsuzluğu "failed to strip debug symbols" hatası
    // veriyor. Sembol soyma atlanır (jniLibs.keepDebugSymbols) — paket biraz
    // büyür ama geçerliliği/imzayı etkilemez.
    packagingOptions {
        jniLibs {
            keepDebugSymbols += "**/*.so"
        }
    }

    // Sözlük seslendirme wav'ları (assets/audio/words, ~1.3GB) Android
    // paketine GÖMÜLMEZ — Play boyut limitlerini aşıyor. Mobil, aynı
    // dosyaları lutke.app'ten çalar (tts_service manifest→URL çevirisi).
    // Web build'i etkilenmez (pubspec değişmedi).
    androidResources {
        ignoreAssetsPattern '!words'
    }

    buildTypes {
        release {
            signingConfig keystorePropertiesFile.exists()
                ? signingConfigs.release
                : signingConfigs.debug
            // NOT (Mayıs 2026): R8 minification geçici olarak kapatıldı —
            // proguard-rules.pro'da bazı reflection-using kütüphaneler için
            // (drift, riverpod codegen, just_audio) kurallar eksikti, build
            // fail ediyordu. İlk Play Store yayınından sonra kuralları
            // tamamlayıp minify'i tekrar açacağız (~%40 boyut tasarrufu).
            shrinkResources false
            minifyEnabled false
        }
        debug {
            // Debug build hızlı kalsın — minify yok.
            shrinkResources false
            minifyEnabled false
        }
    }

    // ── App Bundle yapılandırması (Play Store için) ────────────
    bundle {
        language { enableSplit = true }
        density  { enableSplit = true }
        abi      { enableSplit = true }
    }
}

flutter {
    source = "../.."
}

// Firebase dependency'leri kaldırıldı (Mayıs 2026): Cloudflare auth'a geçtik,
// Firebase analytics + plugin Kotlin 2.x ile uyumsuzluk yaratıyordu.
// firebase_auth Flutter plugin'i kendi Android dep'lerini getiriyor (FlutterFire),
// bu manual dep'lere gerek yok.
dependencies {
}

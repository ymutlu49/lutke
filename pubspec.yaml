name: lutke
description: LÛTKE — Zimanê Kurdî. Kurmancî dil öğretim uygulaması.
publish_to: none
version: 1.0.0+2

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.3

  # Web URL strategy (path-based routing for /reset-password etc.)
  flutter_web_plugins:
    sdk: flutter

  # Local Database (offline-first)
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.3

  # Audio
  just_audio: ^0.9.41
  # PERF 2026-04: `record` (5.1.2) paketini kaldırdık — hiçbir import yoktu
  # (grep -r "package:record" lib/ → 0 hit). Paket ~150KB + platform channel.
  # Speaking ASR `shared/services/speech_recognition_service.dart` üzerinden
  # web SpeechRecognition API'ye direkt gidiyor; native mic asset'ı gerek yok.
  # record: ^5.1.2  ← KALDIRILDI

  # Animations
  flutter_animate: ^4.5.0
  # PERF 2026-04: `lottie` kaldırıldı — hiçbir import yok (grep 0 hit).
  # Tüm animasyonlar flutter_animate ile in-house.
  # lottie: ^3.1.3  ← KALDIRILDI

  # Fonts & Localization
  google_fonts: ^6.2.1
  easy_localization: ^3.0.7

  # Notifications
  # PERF 2026-04: `flutter_local_notifications` hiçbir yerden tüketilmiyor
  # (notification_service.dart import ediyor ama kimse o servisi çağırmıyor).
  # Provider'a da bağlanmamış, sadece kod dosyasında duruyor. Paket ~200KB +
  # native AndroidManifest izinleri. Gereken yerde yeniden eklenir.
  # flutter_local_notifications: ^18.0.1  ← KALDIRILDI

  # Permissions
  # PERF 2026-04: `permission_handler` hiçbir yerden çağrılmıyor (grep 0 hit).
  # Native mic izni tarayıcı Permissions API'siyle zaten alınıyor.
  # permission_handler: ^11.3.1  ← KALDIRILDI

  # Network & Connectivity
  connectivity_plus: ^6.0.5
  dio: ^5.7.0

  # Utils
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  intl: ^0.20.2
  # PERF 2026-04: `cached_network_image` + `shimmer` kaldırıldı — lib/ ağacında
  # `CachedNetworkImage` veya `Shimmer.` kullanımı YOK. Asset'ler lokal, web
  # cache browser tarafında hâlâ. Paketler ~180KB + MP4 placeholder generator.
  # cached_network_image: ^3.4.1  ← KALDIRILDI
  # shimmer: ^3.0.0               ← KALDIRILDI
  share_plus: ^10.0.2

  # FSRS — Spaced Repetition
  # Not: pub.dev'de fsrs veya dart_fsrs araması yapılmalı.
  # Alternatif: fsrs algoritmasını core/utils/fsrs_algorithm.dart'a elle implemente edeceğiz.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.20.0
  riverpod_generator: ^2.6.1
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.1
  mockito: ^5.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/audio/words/
    - assets/audio/listening/
    - assets/images/
    - assets/animations/
    - assets/translations/

  # Fontlar google_fonts paketi ile runtime'da yüklenir.
  # Offline kullanım için assets/fonts/ altına yerleştirin ve bu bölümü aktifleştirin.
  # fonts:
  #   - family: NotoSans
  #     fonts:
  #       - asset: assets/fonts/NotoSans-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/NotoSans-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/NotoSans-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/NotoSans-Bold.ttf
  #         weight: 700

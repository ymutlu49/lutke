<!DOCTYPE html>
<html lang="ku">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>LÛTKE — Têketin tê temam kirin…</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(180deg, #1A7B6B 0%, #0A3D35 100%);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 24px;
    }
    .card {
      max-width: 320px;
      display: flex; flex-direction: column; align-items: center;
      gap: 14px;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .title { font-size: 18px; font-weight: 700; letter-spacing: 0.3px; }
    .msg { font-size: 13px; opacity: 0.78; line-height: 1.5; }
    .err {
      background: rgba(255, 90, 80, 0.18);
      border: 1px solid rgba(255, 90, 80, 0.45);
      color: #fff;
      padding: 12px 16px; border-radius: 12px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="card" role="status" aria-live="polite">
    <div class="spinner" id="spinner" aria-hidden="true"></div>
    <div class="title" id="title">Têketin tê temam kirin…</div>
    <div class="msg" id="msg">Bi xêr bisekine — bi otomatîk vegere LÛTKE'yê.</div>
  </div>
  <script>
    // LÛTKE — Google OAuth implicit-flow callback.
    // Google redirect: /oauth-callback#id_token=...&state=...
    //
    // İki akış:
    //  A) POPUP: window.opener var → token postMessage ile ana pencereye
    //     gönderilir, popup kendini kapatır.
    //  B) FULL-REDIRECT (popup engellendiğinde son çare): opener YOK →
    //     token sessionStorage'a yazılır ve /app/'e dönülür; app'teki
    //     GIS bridge'i (LutkeGoogleSignIn) bir sonraki "Google ile gir"
    //     tıklamasında bu token'ı popup açmadan kullanır.
    //     (Önceden token burada KAYBOLUYORDU — sayfa '/'e yönlendiriyordu.)
    (function () {
      var hashStr   = (window.location.hash   || '').replace(/^#/, '');
      var searchStr = (window.location.search || '').replace(/^\?/, '');
      var params = new URLSearchParams(hashStr || searchStr);

      var token = params.get('id_token');
      var state = params.get('state');
      var error = params.get('error');
      var errorDescription = params.get('error_description');

      // Payload'ı ana pencereye ilet. Teslim edilemezse false döner
      // (full-redirect akışı — opener yok).
      function send(payload) {
        var origin = window.location.origin;
        try {
          if (window.opener && !window.opener.closed) {
            window.opener.postMessage(payload, origin);
            return true;
          }
          if (window.parent && window.parent !== window) {
            window.parent.postMessage(payload, origin);
            return true;
          }
        } catch (_) { /* sessiz */ }
        return false;
      }

      // Full-redirect handoff: sonucu aynı sekmenin sessionStorage'ına yaz.
      // (Google'a git-gel aynı sekmede olduğundan sessionStorage korunur.)
      function stash(payload) {
        try {
          sessionStorage.setItem(
            'lutke_google_redirect_result', JSON.stringify(payload));
        } catch (_) {}
      }

      function setStatus(t, m, asError) {
        var sp = document.getElementById('spinner');
        var tt = document.getElementById('title');
        var mm = document.getElementById('msg');
        if (sp && asError) sp.style.display = 'none';
        if (tt) tt.textContent = t;
        if (mm) {
          mm.textContent = m;
          if (asError) mm.className = 'err';
        }
      }

      var delivered = false;
      var payload;
      try {
        if (error) {
          payload = { type: 'lutke_google_callback', error: error, state: state };
          delivered = send(payload);
          setStatus(
            'Têketin neserkeftî · Giriş başarısız',
            'Sebep: ' + error + (errorDescription ? ' — ' + errorDescription : '') +
              '\n\nVegere LÛTKE\'yê û dîsa biceribîne. · LÛTKE\'ye dönüp tekrar dene.',
            true
          );
        } else if (token) {
          payload = { type: 'lutke_google_callback', token: token, state: state };
          delivered = send(payload);
          setStatus(
            'Têketin serkeftî! · Giriş başarılı!',
            'Vedigerî LÛTKE\'yê… · LÛTKE\'ye dönülüyor…',
            false
          );
        } else {
          payload = { type: 'lutke_google_callback', error: 'no_token', state: state };
          delivered = send(payload);
          setStatus(
            'Têketin neserkeftî · Giriş başarısız',
            'Token nehate stendin. Dîsa biceribîne. · Token alınamadı. Tekrar dene.',
            true
          );
        }
      } catch (e) {
        payload = { type: 'lutke_google_callback', error: 'callback_threw', state: state };
        delivered = send(payload);
      }

      if (delivered) {
        // POPUP akışı — opener mesajı aldı; kendini kapat.
        setTimeout(function () { try { window.close(); } catch (_) {} }, 600);
        // Kapatılamazsa (nadir) app'e dön.
        setTimeout(function () {
          try {
            if (!window.closed) window.location.replace('/app/');
          } catch (_) {}
        }, 2500);
      } else {
        // FULL-REDIRECT akışı — token'ı sakla, app'e dön.
        if (payload) stash(payload);
        setTimeout(function () {
          try { window.location.replace('/app/'); } catch (_) {}
        }, 900);
      }
    })();
  </script>
</body>
</html>
